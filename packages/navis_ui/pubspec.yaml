name: navis_ui
description: A Very Good Project created by Very Good CLI.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

dependencies:
  animated_glitch: ^3.0.0
  cached_network_image: ^4.0.0
  flutter:
    sdk: flutter
  flutter_custom_tabs: ^2.5.0
  gap: ^3.0.1
  html: ^0.15.6
  intl: ^0.20.2
  material_ui: ^1.1.1
  meta: ^1.17.0
  visibility_detector: ^0.4.0+2
  warframe_common:
    path: ../warframe_common
  warframe_icons:
    git: https://github.com/SlayerOrnstein/warframe_icons.git

flutter:
  uses-material-design: true
  assets:
    - assets/Derelict.webp
  shaders:
    - "packages/animated_glitch/shader/glitch.frag"

flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: true
