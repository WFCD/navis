name: navis
version: 2.37.17+505
description: Cephalon Navis is an Android app inspired by Warframe Hub.
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

workspace:
  - packages/*

dependencies:
  animations: ^2.2.0
  arbi_api:
    path: packages/arbi_api
  black_hole_flutter: ^1.2.0
  bloc: ^9.2.1
  cache:
    path: packages/cache
  cached_network_image: ^3.3.1
  collection: ^1.19.0
  dynamic_color: ^1.8.1
  equatable: ^2.1.0
  firebase_core: ^4.11.0
  fish_data:
    path: packages/fish_data
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  flutter_settings_ui: ^3.0.1
  formz: ^0.8.0
  go_router: ^17.3.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http_client:
    path: packages/http_client
  hydrated_bloc: ^11.0.0
  internet_connection_checker_plus: ^3.1.1
  intl: ^0.20.2
  item_repository:
    path: packages/item_repository
  logging: ^1.3.0
  matomo_tracker: ^6.1.1
  navis_ui:
    path: packages/navis_ui
  notification_repository:
    path: packages/notification_repository
  package_info_plus: ^10.1.0
  path_provider: ^2.1.6
  permissions_client:
    path: packages/permissions_client
  profile_repository:
    path: packages/profile_repository
  replay_bloc: ^0.3.0
  responsive_builder: ^0.7.0
  rxdart: ^0.28.0
  # TODO update to v10 when its release for now we need this to update cronet to fix background fetching
  sentry_flutter:
    git:
      url: https://github.com/getsentry/sentry-dart.git
      ref: deps/jni-0.15.x
      path: packages/flutter
  sentry_logging:
    git:
      url: https://github.com/getsentry/sentry-dart.git
      ref: deps/jni-0.15.x
      path: packages/logging
  settings_repository:
    path: packages/settings_repository
  simple_icons: ^16.23.0
  storage:
    path: packages/storage
  visibility_detector: ^0.4.0+2
  warframe_api:
    path: packages/warframe_api
  warframe_common:
    path: packages/warframe_common
  warframe_drop_repository:
    path: packages/warframe_drop_repository
  worldstate_repository:
    path: packages/worldstate_repository

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  commitlint_cli: ^0.8.1
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.1.1
  husky: ^0.1.7
  mocktail: ^1.0.5
  path: ^1.8.3
  sentry_dart_plugin: ^3.4.0
  test: ^1.26.3
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/baro_banner.webp
    - assets/varzia_banner.webp
    - assets/arcanes/

sentry:
  upload_debug_symbols: true
  upload_sources: true
  wait_for_processing: true
  dart_symbol_map_path: build/app/outputs/obfuscation.map.json

flutter_launcher_icons:
  image_path: "assets/splash.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_foreground: assets/splash.png
  adaptive_icon_foreground_inset: 5
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  image: assets/splash.png
  color: "#FFFFFF"
  color_dark: "#121212"
  android_12:
    image: assets/splash.png
